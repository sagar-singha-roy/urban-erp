[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-common"
version = "0.1.0"
description = "Shared runtime for Urban module services: authorization, tenancy, cache and events."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "valkey==6.2.0",
  "aiokafka==0.15.0",
  "httpx==0.28.1",
]

[tool.setuptools]
packages = ["urban_common"]

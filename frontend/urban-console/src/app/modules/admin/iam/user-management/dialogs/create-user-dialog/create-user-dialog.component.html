<div class="dialog-overlay" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <div class="header-titles">
        <h3>{{ user ? 'Edit Municipal User Profile' : 'Create Global User' }}</h3>
        <p class="subtitle">ADM-R01 Identity & Access User Provisioning</p>
      </div>
      <button class="close-btn" (click)="onCancel()" title="Close dialog">
        <app-icon name="ri-close-line" [size]="18"></app-icon>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="dialog-form">
      <div class="dialog-body">
        <!-- Name Row -->
        <div class="form-row-3">
          <div class="form-group">
            <label>First Name <span class="required">*</span></label>
            <input type="text" [(ngModel)]="firstName" name="firstName" required class="form-input" placeholder="e.g. Suresh" />
          </div>
          <div class="form-group">
            <label>Middle Name</label>
            <input type="text" [(ngModel)]="middleName" name="middleName" class="form-input" placeholder="Optional" />
          </div>
          <div class="form-group">
            <label>Last Name <span class="required">*</span></label>
            <input type="text" [(ngModel)]="lastName" name="lastName" required class="form-input" placeholder="e.g. Kumar" />
          </div>
        </div>

        <!-- Contact & ID Row -->
        <div class="form-row-2">
          <div class="form-group">
            <label>Email Address <span class="required">*</span></label>
            <input type="email" [(ngModel)]="email" name="email" required class="form-input" placeholder="officer@state.gov.in" />
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" [(ngModel)]="mobileNumber" name="mobileNumber" class="form-input" placeholder="+91 98480 12345" />
          </div>
        </div>

        @if (!user) {
          <!-- Password setup for new account -->
          <div class="form-row-2">
            <div class="form-group">
              <label>Initial Login Password <span class="required">*</span></label>
              <div class="password-input-wrap">
                <input
                  [type]="showPassword() ? 'text' : 'password'"
                  [(ngModel)]="password"
                  name="password"
                  required
                  class="form-input mono"
                  placeholder="Urban@2026"
                />
                <button type="button" class="btn-toggle-pwd" (click)="showPassword.set(!showPassword())" title="Toggle visibility">
                  <app-icon [name]="showPassword() ? 'ri-eye-off-line' : 'ri-eye-line'" [size]="15"></app-icon>
                </button>
              </div>
              <span class="field-hint">Default is <code>Urban@2026</code>. Officer can change on first login.</span>
            </div>
            <div class="form-group align-end">
              <button type="button" class="btn-action-outline" (click)="generateRandomPassword()" style="margin-top: 1.5rem;">
                <app-icon name="ri-magic-line" [size]="14"></app-icon>
                <span>Generate Strong Password</span>
              </button>
            </div>
          </div>
        }

        <div class="form-group">
          <label>User ID (System-generated UUID)</label>
          <input type="text" [value]="userId" disabled class="form-input mono disabled" />
        </div>

        <!-- IDP & External ID -->
        <div class="form-row-2">
          <div class="form-group">
            <label>Identity Provider <span class="required">*</span></label>
            <select [(ngModel)]="idpProvider" name="idpProvider" class="form-select">
              @for (idp of idpProviders; track idp) {
                <option [value]="idp">{{ idp }}</option>
              }
            </select>
          </div>
          <div class="form-group">
            <label>External Identity ID (Conditional)</label>
            <input type="text" [(ngModel)]="externalIdentityId" name="externalIdentityId" class="form-input mono" placeholder="e.g. AADHAAR-HASH or NIC-ID" />
          </div>
        </div>

        <!-- User Type & Status -->
        <div class="form-row-2">
          <div class="form-group">
            <label>User Type <span class="required">*</span></label>
            <select [(ngModel)]="userType" name="userType" class="form-select">
              @for (ut of userTypes; track ut) {
                <option [value]="ut">{{ ut }}</option>
              }
            </select>
          </div>
          <div class="form-group">
            <label>Account Status <span class="required">*</span></label>
            <select [(ngModel)]="accountStatus" name="accountStatus" class="form-select">
              @for (st of accountStatuses; track st) {
                <option [value]="st">{{ st }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Employment & Department -->
        <div class="form-row-3">
          <div class="form-group">
            <label>Employee / Officer ID</label>
            <input type="text" [(ngModel)]="employeeId" name="employeeId" class="form-input mono" placeholder="e.g. TG-GO-2024" />
          </div>
          <div class="form-group">
            <label>Designation</label>
            <input type="text" [(ngModel)]="designation" name="designation" class="form-input" placeholder="e.g. Revenue Officer" />
          </div>
          <div class="form-group">
            <label>Department</label>
            <select [(ngModel)]="department" name="department" class="form-select">
              <option value="">Select Department</option>
              @for (dept of departments; track dept) {
                <option [value]="dept">{{ dept }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Expiry & Language -->
        <div class="form-row-3">
          <div class="form-group">
            <label>Account Expiry Date</label>
            <input type="date" [(ngModel)]="accountExpiryDate" name="accountExpiryDate" class="form-input" />
          </div>
          <div class="form-group">
            <label>Preferred Language</label>
            <select [(ngModel)]="preferredLanguage" name="preferredLanguage" class="form-select">
              <option value="English">English</option>
              <option value="Hindi">Hindi</option>
              <option value="Telugu">Telugu</option>
              <option value="Marathi">Marathi</option>
            </select>
          </div>
          <div class="form-group">
            <label>Time Zone</label>
            <input type="text" [(ngModel)]="timeZone" name="timeZone" class="form-input" placeholder="Asia/Kolkata" />
          </div>
        </div>

        <!-- Remarks -->
        <div class="form-group">
          <label>Remarks & Justification</label>
          <textarea [(ngModel)]="remarks" name="remarks" rows="2" class="form-textarea" placeholder="Statutory authorization reference or appointment notes..."></textarea>
        </div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
          <app-icon [name]="isSubmitting() ? 'ri-loader-4-line' : 'ri-check-line'" [size]="16" [class.spinning]="isSubmitting()"></app-icon>
          <span>{{ user ? 'Update User' : 'Create User' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>

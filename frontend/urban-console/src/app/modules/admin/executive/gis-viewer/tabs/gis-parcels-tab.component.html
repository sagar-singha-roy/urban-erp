<div class="form-grid">
  <label>State Tenant *
    <select [(ngModel)]="filter().state">
      <option value="">All accessible states</option>
      @for (s of options().states; track s.code) { <option [value]="s.code">{{ s.name }}</option> }
    </select>
  </label>
  <label>ULB / City *
    <select [(ngModel)]="filter().tenantId" (ngModelChange)="filter().tenantId = $event; filter().wards = []; tenantChange.emit($event)">
      <option value="">Select</option>
      @for (u of ulbs(); track u.code) { <option [value]="u.code">{{ u.name }}</option> }
    </select>
  </label>
  <label>Ward
    <app-gis-multi-select [items]="options().wards" valueKey="id" labelKey="name" placeholder="All" [(value)]="filter().wards"></app-gis-multi-select>
  </label>
  <label>Parcel Category
    <app-gis-multi-select [items]="options().parcelCategories" placeholder="All" [(value)]="filter().categories"></app-gis-multi-select>
  </label>
  <label>Parcel Status
    <app-gis-multi-select [items]="options().parcelStatuses" placeholder="All" [(value)]="filter().statuses"></app-gis-multi-select>
  </label>
  <label>Survey Status
    <select [(ngModel)]="filter().surveyStatus">
      <option value="">All</option>
      @for (o of options().surveyStatuses; track o) { <option [value]="o">{{ o }}</option> }
    </select>
  </label>
  <label>GIS Mapping Status
    <select [(ngModel)]="filter().gisStatus">
      <option value="mapped">Mapped</option>
      <option value="unmapped">Unmapped</option>
    </select>
  </label>
  <label>Parcel Data Source *
    <select [(ngModel)]="filter().dataSource">
      @for (o of options().dataSources; track o) { <option [value]="o">{{ o }}</option> }
    </select>
  </label>
  <label>Parcel Layer *
    <select [(ngModel)]="filter().layerId">
      <option value="">{{ filter().dataSource === 'PostGIS' ? 'Registered parcels only' : 'Select' }}</option>
      @for (l of layersFor('Parcel'); track l.id) { <option [value]="l.id">{{ l.layerName }}</option> }
    </select>
  </label>
  <label>Parcel Label Field
    <select [(ngModel)]="filter().labelField">
      <option value="ulpin">ULPIN</option>
      <option value="surveyNumber">Survey Number</option>
      <option value="address">Address</option>
    </select>
  </label>
  <label>Search by Parcel ID
    <input type="search" [(ngModel)]="filter().search" placeholder="ULPIN or survey number" />
  </label>
  <label class="toggle">Boundary Display <input class="switch" type="checkbox" [(ngModel)]="filter().boundaryDisplay" /></label>
</div>
<div class="actions"><button type="button" class="primary" (click)="show.emit()">Show on Map</button></div>

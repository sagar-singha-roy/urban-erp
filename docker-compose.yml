x-module-service: &module-service
  restart: always
  environment:
    ENVIRONMENT: development
    CORS_ORIGINS: http://localhost:4200
    DATABASE_URL: postgresql+asyncpg://urban_app:${APP_DB_PASSWORD:?Set it in .env}@postgres:5432/urban_erp
    VALKEY_URL: valkey://valkey:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CORE_SERVICE_URL: http://core-service:8000
    FORWARDED_ALLOW_IPS: "*"
  depends_on:
    - core-service
    - valkey
    - kafka

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urban-postgres
    restart: always
    environment:
      POSTGRES_DB: urban_erp
      POSTGRES_USER: urban_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban_admin -d urban_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: urban-valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: urban-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: urban-keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set it in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/urban_erp
      KC_DB_USERNAME: urban_admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set it in .env}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command:
      - "start-dev"
      - "--import-realm"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  core-service:
    build:
      context: ./backend/services/core_service
      dockerfile: Dockerfile
    container_name: urban-core-service
    restart: always
    environment:
      ENVIRONMENT: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      CORS_ORIGINS: http://localhost:4200
      FORWARDED_ALLOW_IPS: "*"
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://urban_app:${APP_DB_PASSWORD:?Set it in .env}@postgres:5432/urban_erp
      WRITE_DATABASE_URL: postgresql+asyncpg://urban_app:${APP_DB_PASSWORD:?Set it in .env}@postgres:5432/urban_erp
      READ_DATABASE_URL: postgresql+asyncpg://urban_app:${APP_DB_PASSWORD:?Set it in .env}@postgres:5432/urban_erp
      DB_ADMIN_URL: postgresql+asyncpg://urban_admin:${POSTGRES_PASSWORD:?Set it in .env}@postgres:5432/urban_erp
      BACKUP_DIR: /backups
      VALKEY_URL: valkey://valkey:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: urban
      KEYCLOAK_CLIENT_ID: urban-web
      DEFAULT_TENANT_ID: GWMC
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/services/core_service/app:/app/app
      - backup_data:/backups
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  ptx-service:
    <<: *module-service
    build:
      context: ./backend
      dockerfile: services/module.Dockerfile
      args:
        SERVICE: ptx_service
    container_name: urban-ptx-service
    ports:
      - "127.0.0.1:8101:8000"

  wtr-service:
    <<: *module-service
    build:
      context: ./backend
      dockerfile: services/module.Dockerfile

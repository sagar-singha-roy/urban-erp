# Urban API gateway: the single public address. Add a module's API paths to this map when it gets routes.
map $uri $upstream_service {
    default                        core;
    ~^/api/v1/properties(/|$)      ptx;
    ~^/api/v1/wtr(/|$)             wtr;
    ~^/api/v1/grv(/|$)             grv;
    ~^/api/v1/fin(/|$)             fin;
    ~^/api/v1/trl(/|$)             trl;
    ~^/api/v1/uch(/|$)             uch;
    ~^/api/v1/swm(/|$)             swm;
    ~^/api/v1/hrm(/|$)             hrm;
    ~^/api/v1/dms(/|$)             dms;
    ~^/api/v1/eng(/|$)             eng;
    ~^/api/v1/bpm(/|$)             bpm;
    ~^/api/v1/slm(/|$)             slm;
    ~^/api/v1/tpl(/|$)             tpl;
    ~^/api/v1/prk(/|$)             prk;
    ~^/api/v1/mpm(/|$)             mpm;
    ~^/api/v1/lgl(/|$)             lgl;
    ~^/api/v1/inv(/|$)             inv;
    ~^/api/v1/fnc(/|$)             fnc;
    ~^/api/v1/gsc(/|$)             gsc;
    ~^/(?!api/)                    console;
}

# Per client address. Limits leave room for many staff sharing one office connection.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;
limit_req_status 429;

server {
    listen 8088;
    server_tokens off;
    # GIS layer imports are posted as JSON.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    # Overwritten, not appended: clients must not be able to choose the address sign-in throttling sees.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    error_page 429 = @too_many;
    error_page 502 503 504 = @unavailable;

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    # Only module services call this, directly on the internal network.
    location = /api/v1/auth/authorize {
        return 404;
    }

    location = /api/v1/auth/signin {
        limit_req zone=signin burst=30 nodelay;
        proxy_pass http://$service_addr;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://$service_addr;
    }

    location / {
        proxy_pass http://$service_addr;
    }

    location @too_many {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"detail":"This service is not available right now."}';
    }
}

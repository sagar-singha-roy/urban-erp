# Urban API gateway: the single public address. Add a module's API paths to this map when it gets routes.
map $uri $upstream_service {
    default                        core;
    ~^/api/v1/properties(/|$)      ptx;
    ~^/api/v1/wtr(/|$)             wtr;
    ~^/api/v1/grv(/|$)             grv;
    ~^/api/v1/fin(/|$)             fin;
    ~^/api/v1/trl(/|$)             trl;
    ~^/api/v1/uch(/|$)             uch;
    ~^/api/v1/swm(/|$)             swm;
    ~^/api/v1/hrm(/|$)             hrm;
    ~^/api/v1/dms(/|$)             dms;
    ~^/api/v1/eng(/|$)             eng;
    ~^/api/v1/bpm(/|$)             bpm;
    ~^/api/v1/slm(/|$)             slm;
    ~^/api/v1/tpl(/|$)             tpl;
    ~^/api/v1/prk(/|$)             prk;
    ~^/api/v1/mpm(/|$)             mpm;
    ~^/api/v1/lgl(/|$)             lgl;
    ~^/api/v1/inv(/|$)             inv;
    ~^/api/v1/fnc(/|$)             fnc;
    ~^/api/v1/gsc(/|$)             gsc;
    ~^/(?!api/)                    console;
}

# Per client address. Limits leave room for many staff sharing one office connection.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;
limit_req_status 429;

# Hostnames not listed here or generated from active domain mappings are refused.
server {
    listen 8088 default_server;
    server_tokens off;
    return 444;
}

server {
    listen 8443 ssl default_server;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 8088;
    server_tokens off;
    include platform_hosts.conf;
    include server_common.conf;
}

# Written by gateway/apply_generated.sh after nginx -t passes.
include generated/live/sites.conf;

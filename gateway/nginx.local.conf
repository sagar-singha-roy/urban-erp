# nginx -p gateway -c nginx.local.conf
pid /tmp/urban-gateway.pid;
error_log /tmp/urban-gateway-error.log;

events {}

http {
    access_log /tmp/urban-gateway-access.log;
    client_body_temp_path /tmp/urban-gateway-body;
    proxy_temp_path /tmp/urban-gateway-proxy;
    fastcgi_temp_path /tmp/urban-gateway-fastcgi;
    uwsgi_temp_path /tmp/urban-gateway-uwsgi;
    scgi_temp_path /tmp/urban-gateway-scgi;
    include upstreams.local.conf;
    include gateway.conf;
}

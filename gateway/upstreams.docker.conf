# Compose network: names resolve through Docker, so a stopped module cannot stop the gateway.
resolver 127.0.0.11 valid=10s;
map $upstream_service $service_addr {
    core core-service:8000;
    console urban-console:80;
    ptx ptx-service:8000;
    wtr wtr-service:8000;
    grv grv-service:8000;
    fin fin-service:8000;
    trl trl-service:8000;
    uch uch-service:8000;
    swm swm-service:8000;
    hrm hrm-service:8000;
    dms dms-service:8000;
    eng eng-service:8000;
    bpm bpm-service:8000;
    slm slm-service:8000;
    tpl tpl-service:8000;
    prk prk-service:8000;
    mpm mpm-service:8000;
    lgl lgl-service:8000;
    inv inv-service:8000;
    fnc fnc-service:8000;
    gsc gsc-service:8000;
}

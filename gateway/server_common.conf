# Shared by the platform hosts and every generated tenant host.
# GIS layer imports are posted as JSON.
client_max_body_size 50m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Request-ID $request_id always;
# Defence in depth for tenant Custom CSS, which is also filtered when saved.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# Overwritten, not appended: clients must not be able to choose the address sign-in throttling sees.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;

error_page 429 = @too_many;
error_page 502 503 504 = @unavailable;

location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"UP","service":"api-gateway"}';
}

# Only module services call this, directly on the internal network.
location = /api/v1/auth/authorize {
    return 404;
}

location = /api/v1/auth/signin {
    limit_req zone=signin burst=30 nodelay;
    proxy_pass http://$service_addr;
}

location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://$service_addr;
}

location / {
    proxy_pass http://$service_addr;
}

location @too_many {
    default_type application/json;
    return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
}

location @unavailable {
    default_type application/json;
    return 503 '{"detail":"This service is not available right now."}';
}

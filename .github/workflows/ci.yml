name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/core_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-only-signing-key
          AUDIT_SIGNING_KEY: ci-only-audit-key

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/gateway:/etc/nginx/urban:ro" nginx:1.27-alpine nginx -t -c /etc/nginx/urban/nginx.docker.conf

  module-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ./backend/libs/urban_common
      - run: python -m unittest discover -s tests
        working-directory: backend/libs/urban_common
        env:
          ENVIRONMENT: test
      - run: python -m unittest discover -s tests
        working-directory: backend/services/ptx_service
        env:
          ENVIRONMENT: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/urban-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build -- --configuration production
      - run: npx ng test --watch=false

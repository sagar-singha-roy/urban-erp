name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/core_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-only-signing-key
          AUDIT_SIGNING_KEY: ci-only-audit-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/urban-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build -- --configuration production
      - run: npx ng test --watch=false
